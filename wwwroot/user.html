<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cổng bệnh nhân | Medika</title><link rel="stylesheet" href="/role.css"></head><body><div class="shell"><aside class="rail"><div class="brand"><span class="brand-mark">+</span> medika</div><p>CỔNG BỆNH NHÂN<br>Đặt lịch và theo dõi chăm sóc sức khỏe.</p><nav class="nav"><a class="active" href="/user.html">Lịch khám</a><a href="#support">Hỗ trợ trực tuyến</a></nav><div class="rail-bottom">Hồ sơ của bạn được bảo mật</div></aside><main class="main"><header class="top"><div><h1>Lịch khám của tôi</h1><p id="welcome">Đang tải...</p></div><button id="logout" class="logout">Đăng xuất</button></header><section class="grid"><article class="card wide"><h2>Đặt lịch khám</h2><form id="booking-form" class="form"><label>Chuyên khoa<select id="specialty" required><option value="">Chọn chuyên khoa</option></select></label><label>Bác sĩ<select id="doctor-id" required><option value="">Chọn bác sĩ</option></select></label><label>Ngày và giờ<input id="appointment-date" type="datetime-local" required></label><label>Lý do khám<textarea id="reason" required placeholder="Mô tả ngắn nhu cầu khám"></textarea></label><button class="button" type="submit">Gửi yêu cầu đặt lịch</button></form><p id="message" class="message"></p></article><article class="card"><h2>Hỗ trợ</h2><form id="support-form" class="form"><label>Chủ đề<input id="subject" required></label><label>Nội dung<textarea id="content" required></textarea></label><button class="button alt" type="submit">Gửi câu hỏi</button></form></article><article class="card full"><h2>Lịch hẹn của tôi</h2><div id="appointments" class="list"></div></article></section></main></div><script src="/user-workspace.js"></script></body></html>
