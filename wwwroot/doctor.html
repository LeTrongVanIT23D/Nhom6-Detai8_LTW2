<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Không gian bác sĩ | Medika</title><link rel="stylesheet" href="/role.css"></head><body><div class="shell"><aside class="rail"><div class="brand"><span class="brand-mark">+</span> medika</div><p>KHÔNG GIAN BÁC SĨ<br>Hồ sơ khám, toa thuốc và lịch làm việc.</p><nav class="nav"><a class="active" href="/doctor.html">Bệnh án</a><a href="#schedule">Lịch làm việc</a></nav><div class="rail-bottom">Thông tin chuyên môn nội bộ</div></aside><main class="main"><header class="top"><div><h1>Bảng điều trị</h1><p id="welcome">Đang tải...</p></div><button id="logout" class="logout">Đăng xuất</button></header><section class="grid"><article class="card wide"><h2>Ghi hồ sơ bệnh án</h2><form id="record-form" class="form"><label>Mã bệnh nhân<input id="patient-id" type="number" min="1" required></label><label>Mã bác sĩ<input id="doctor-id" type="number" min="1" required></label><label>Triệu chứng<textarea id="symptoms" required></textarea></label><label>Chẩn đoán<textarea id="diagnosis" required></textarea></label><label>Ghi chú<textarea id="notes"></textarea></label><button class="button" type="submit">Lưu hồ sơ khám</button></form></article><article class="card"><h2>Kê toa thuốc</h2><form id="prescription-form" class="form"><label>Mã hồ sơ<input id="record-id" type="number" min="1" required></label><label>Thuốc và liều dùng<textarea id="medicines" required placeholder="Tên thuốc - liều - số ngày"></textarea></label><label>Hướng dẫn<textarea id="instructions" required></textarea></label><button class="button alt" type="submit">Lưu toa thuốc</button></form><p id="message" class="message"></p></article><article class="card full"><h2>Lịch sử bệnh án gần đây</h2><div id="records" class="list"></div></article></section></main></div><script src="/doctor-workspace.js"></script></body></html>
